# Syntax Practice — single-host deployment.
#
#   cp .env.production.example .env      # then fill in the three secrets
#   docker compose up -d --build
#   docker compose logs -f app           # first start seeds 142 questions
#
# Compose reads .env from this directory and refuses to start — before it
# builds anything — if a required secret is missing. See docs/DEPLOYMENT.md.

services:
  app:
    build: .
    image: syntax-practice:latest
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:?is not set. Copy .env.production.example to .env and set it (openssl rand -hex 32)}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?is not set. Set it in .env — it becomes the admin password}
      SEED_STUDENT_PASSWORD: ${SEED_STUDENT_PASSWORD:?is not set. Set it in .env — it becomes the demo student password}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      SANDBOX_MAX_CONCURRENT: ${SANDBOX_MAX_CONCURRENT:-4}
      AI_ENABLED: ${AI_ENABLED:-true}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "${HOST_PORT:-4000}:4000"
    volumes:
      # The SQLite database. Without a named volume every rebuild would start
      # from an empty bank and lose every student's progress.
      - sp-data:/data
    # Student code runs in the subprocess sandbox inside this container, so the
    # container itself is an outer boundary. It needs no extra privileges and
    # must never be given the Docker socket.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 2g
    read_only: true
    tmpfs:
      # The sandbox's scratch space. `exec` is required: Docker mounts tmpfs
      # noexec by default, and the C and C++ graders compile a binary here and
      # run it — without it every C/C++ submission fails with "Permission
      # denied", and so does seeding their reference solutions.
      - /app/.tmp:uid=10001,gid=10001,mode=0700,size=256m,exec
      - /tmp:size=64m

volumes:
  sp-data:
